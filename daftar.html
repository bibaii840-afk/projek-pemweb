<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Pendaftaran</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="situs-header">
        <a href="index.html" class="logo">KampusEvent</a>
        <button class="menu-toggle" id="menu-toggle" aria-expanded="false">Menu</button>
        <nav id="nav-menu" class="nav-menu">
            <ul>
                <li><a href="index.html">Beranda</a></li>
                <li><a href="events.html">Event</a></li>
                <li><a href="daftar.html" aria-current="page">Daftar</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h1>Form pendaftaran</h1>
            <form id="form-daftar" class="form-grid" novalidate>
                <div class="field">
                    <label for="nama">Nama lengkap</label>
                    <input id="nama" name="nama" type="text">
                    <span class="galat" id="galat-nama"></span>
                </div>
                <div class="field">
                    <label for="nim">NIM</label>
                    <input id="nim" name="nim" type="text" inputmode="numeric">
                    <span class="galat" id="galat-nim"></span>
                </div>
                <div class="field">
                    <label for="email">Email</label>
                    <input id="email" name="email" type="email">
                    <span class="galat" id="galat-email"></span>
                </div>
                <div class="field">
                    <label for="pilih-event">Event</label>
                    <select id="pilih-event" name="event"></select>
                </div>
                <button type="submit" class="btn">Daftar sekarang</button>
            </form>
            <p class="pesan" id="pesan" role="status"></p>
        </section>

        <section>
          <h2>Pendaftar terbaru</h2>
          <ul class="pendaftar" id="daftar-pendaftar"></ul>
        </section>
      </main>
    
      <footer class="situs-footer">
        <p>&copy; 2026 KampusEvent. Dibuat untuk tugas Pemrograman Web.</p>
      </footer>
    
</body>
</html>
